name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

        
      - name: Validate Python syntax
        run: |
          python -m compileall airflow/dags

        
      - name: Create dbt profile
        run: |
          mkdir -p ~/.dbt

          cat > ~/.dbt/profiles.yml <<EOF
          banking_dbt:
            target: dev
            outputs:
              dev:
                type: snowflake
                account: ${{ secrets.SNOWFLAKE_ACCOUNT }}
                user: ${{ secrets.SNOWFLAKE_USER }}
                password: ${{ secrets.SNOWFLAKE_PASSWORD }}
                role: ${{ secrets.SNOWFLAKE_ROLE }}
                database: ${{ secrets.SNOWFLAKE_DATABASE }}
                warehouse: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
                schema: ${{ secrets.SNOWFLAKE_SCHEMA }}
                threads: 1
          EOF


      - name: Validate dbt project
        working-directory: banking_dbt
        run: |
          dbt --version
          dbt parse
        
      - name: Build Airflow image
        run: |
          docker build \
            -t banking-airflow-ci \
            -f airflow/Dockerfile \
            .
            
      - name: Create Docker network
        run: |
          docker network create airflow-ci

      - name: Start Airflow metadata database
        run: |
          docker run -d \
            --name airflow-postgres-ci \
            --network airflow-ci \
            -e POSTGRES_PASSWORD=airflow \
            -e POSTGRES_USER=airflow \
            -e POSTGRES_DB=airflow \
            postgres:16

      - name: Wait for PostgreSQL
        run: |
          until docker exec airflow-postgres-ci pg_isready -U airflow -d airflow; do
            echo "Waiting for PostgreSQL to be ready..."
            sleep 2
          done

      - name: Initialize Airflow metadata database
        run: |
          docker run --rm \
            --network airflow-ci \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres-ci:5432/airflow \
            -v ${{ github.workspace }}/airflow/dags:/opt/airflow/dags \
            -v ${{ github.workspace }}/banking_dbt:/home/airflow/banking_dbt \
            banking-airflow-ci \
            airflow db migrate


      - name: Validate Airflow DAGs
        run: |
          docker run --rm \
            --network airflow-ci \
            -e AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@airflow-postgres-ci:5432/airflow \
            -v ${{ github.workspace }}/airflow/dags:/opt/airflow/dags \
            -v ${{ github.workspace }}/banking_dbt:/home/airflow/banking_dbt \
            banking-airflow-ci \
            airflow dags list

      - name: Cleanup CI containers
        if: always()
        run: |
          docker rm -f airflow-postgres-ci || true
          docker network rm airflow-ci || true
