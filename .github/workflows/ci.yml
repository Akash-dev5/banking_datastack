name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  validate:
    name: Validate Project
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

        
      - name: Validate Python syntax
        run: |
          python -m compileall airflow/dags

        
      - name: Validate dbt project
        working-directory: banking_dbt
        run: |
          dbt --version
          dbt parse
        
      - name: Build Airflow image
        run: |
          docker build \
            -t banking-airflow-ci \
            -f airflow/Dockerfile \
            .

      - name: Validate Airflow DAGs
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/airflow/dags:/opt/airflow/dags \
            -v ${{ github.workspace }}/banking_dbt:/home/airflow/banking_dbt \
            banking-airflow-ci \
            airflow dags list
