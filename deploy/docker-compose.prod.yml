x-airflow-common:
  &airflow-common
  image: ghcr.io/akash-dev5/banking-airflow:${AIRFLOW_IMAGE_TAG}


  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-api-server:8080/execution/
    AIRFLOW__FAB__SESSION_BACKEND: securecookie
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

    AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
    AWS_DEFAULT_REGION: ${S3_REGION}

  volumes:
    - ./dbt/.dbt:/home/airflow/banking_dbt/.dbt:ro

x-airflow-dependencies:
  &airflow-dependencies
  restart: unless-stopped
  depends_on:
    airflow-init:
      condition: service_completed_successfully

services:
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres-prod
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
    
    volumes:
      - airflow_postgres_data:/var/lib/postgresql/data
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  
  airflow-init:
    <<: *airflow-common

    depends_on:
      airflow-postgres:
        condition: service_healthy

    entrypoint: /bin/bash
    command: >
      -c " 
      airflow db migrate &&

      airflow users create \
      --username ${AIRFLOW_ADMIN_USER} \
      --firstname ${AIRFLOW_ADMIN_FIRSTNAME} \
      --lastname ${AIRFLOW_ADMIN_LASTNAME} \
      --role ${AIRFLOW_ADMIN_ROLE} \
      --email ${AIRFLOW_ADMIN_EMAIL} \
      --password ${AIRFLOW_ADMIN_PASSWORD}  &&
      echo '✅ Airflow DB initialized successfully.'
      "

  airflow-api-server:
    container_name: banking-airflow-api-server
    <<: [*airflow-common, *airflow-dependencies]
    ports:
      - "8080:8080"
    
    command: api-server

  airflow-scheduler:
    container_name: banking-airflow-scheduler
    <<: [*airflow-common, *airflow-dependencies]
    command: scheduler

  airflow-dag-processor:
    container_name: banking-airflow-dag-processor
    <<: [*airflow-common, *airflow-dependencies]
    command: dag-processor

  airflow-triggerer:
    container_name: banking-airflow-triggerer
    <<: [*airflow-common, *airflow-dependencies]
    command: triggerer

volumes:
  airflow_postgres_data: