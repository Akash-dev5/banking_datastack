x-airflow-common:
        &airflow-common
        build:
            context: .
            dockerfile: airflow/Dockerfile
        restart: unless-stopped
        depends_on:
            airflow-init:
                condition: service_completed_successfully
        environment:
            AIRFLOW__CORE__EXECUTOR: LocalExecutor
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
            AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
            AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
            AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
            AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
            AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-webserver:8080/execution/
            AIRFLOW__FAB__SESSION_BACKEND: securecookie
            AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}

            AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
            AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
            AWS_DEFAULT_REGION: ${S3_REGION}
            
        volumes:
            - ./airflow/dags:/opt/airflow/dags
            - ./airflow/logs:/opt/airflow/logs
            - ./airflow/plugins:/opt/airflow/plugins
            - ./banking_dbt:/home/airflow/banking_dbt


x-health-common:
        &health-common
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 20s



services:
    postgres:
        image: postgres:16
        environment:
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_DB: ${POSTGRES_DB}
        restart: unless-stopped
        ports:
            - "5432:5432"
        healthcheck:
            <<: *health-common
            test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
        volumes:
            - ./postgres/data:/var/lib/postgresql/data
            - ./postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
        command: >
            postgres
            -c wal_level=logical
            -c max_wal_senders=10
            -c max_replication_slots=10
    


    kafka-connect:
        image: debezium/connect:2.2
        container_name: kafka-connect
        depends_on:
            postgres:
                condition: service_healthy
            kafka:
                condition: service_healthy
        ports:
            - "8083:8083"
        restart: unless-stopped
        environment:
            BOOTSTRAP_SERVERS: 'kafka:9092'
            GROUP_ID: '1'
            CONFIG_STORAGE_TOPIC: 'connect-configs'
            OFFSET_STORAGE_TOPIC: 'connect-offsets'
            STATUS_STORAGE_TOPIC: 'connect-status'
            KEY_CONVERTER_SCHEMAS_ENABLE: 'false'
            VALUE_CONVERTER_SCHEMAS_ENABLE: 'false'
            KEY_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
            VALUE_CONVERTER: 'org.apache.kafka.connect.json.JsonConverter'
            

    consumer:
        build:
            context: .
            dockerfile: services/consumer/Dockerfile
        container_name: consumer
        restart: unless-stopped
        depends_on:
            kafka:
                condition: service_healthy
            kafka-connect:
                condition: service_started
        env_file:
            - .env


    kafka:
        image: confluentinc/cp-kafka:7.7.0
        container_name: kafka
        ports:
            - "9092:9092"
            - "29092:29092"
        restart: unless-stopped
        healthcheck:
            <<: *health-common
            test: [ "CMD", "kafka-broker-api-versions","--bootstrap-server", "localhost:9092"]
        environment:
            CLUSTER_ID: '${KAFKA_CLUSTER_ID}'
            KAFKA_NODE_ID: 1
            KAFKA_PROCESS_ROLES: broker, controller
            KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
            KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://host.docker.internal:29092
            KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
            KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
            KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
            KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
            KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_TOPIC_REPLICATION_FACTOR: 1
            KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
            KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
        volumes:
            - ./kafka/data:/tmp/kraft-combined-logs



    kafka-ui:
        image: provectuslabs/kafka-ui:latest
        container_name: kafka-ui
        depends_on:
            - kafka
        ports:
            - "8084:8080"
        restart: unless-stopped
        environment:
            KAFKA_CLUSTERS_0_NAME: banking-cluster
            KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

            KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: kafka-connect
            KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083



    airflow-postgres:
        image: postgres:16
        environment: 
            POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
            POSTGRES_USER: ${AIRFLOW_DB_USER}
            POSTGRES_DB: ${AIRFLOW_DB_NAME}
        restart: unless-stopped 
        healthcheck:
            <<: *health-common
            test: ["CMD-SHELL", "pg_isready -U ${AIRFLOW_DB_USER} -d ${AIRFLOW_DB_NAME}"]
        ports:
            - "5433:5432"
        volumes:
            - ./airflow/airflow-postgres/data:/var/lib/postgresql/data
        


    airflow-init:
        build:
            context: .
            dockerfile: airflow/Dockerfile

        depends_on:
            airflow-postgres:
                condition: service_healthy

        environment:
            AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
            AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
            AIRFLOW__CORE__LOAD_EXAMPLES: "false"
            AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: ${AIRFLOW_DB_CONN}
            AIRFLOW__CORE__AUTH_MANAGER: airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
        entrypoint: /bin/bash
        command: >
            -c " 
            airflow db migrate &&

            airflow users create \
            --username ${AIRFLOW_ADMIN_USER} \
            --firstname ${AIRFLOW_ADMIN_FIRSTNAME} \
            --lastname ${AIRFLOW_ADMIN_LASTNAME} \
            --role ${AIRFLOW_ADMIN_ROLE} \
            --email ${AIRFLOW_ADMIN_EMAIL} \
            --password ${AIRFLOW_ADMIN_PASSWORD}  &&
            echo '✅ Airflow DB initialized successfully.'
            "

    

    airflow-scheduler:
        <<: *airflow-common
        command: scheduler

    airflow-webserver:
        <<: *airflow-common
        ports:
            - "8080:8080"
        command: api-server

    airflow-dag-processor:
        <<: *airflow-common
        command: dag-processor

    airflow-triggerer:
        <<: *airflow-common
        command: triggerer